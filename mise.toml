[tools]
go = "1.26"
"github:caarlos0/svu" = "latest"

[tasks.run]
description = "Run the CLI"
run = "go run ./main.go {{arg()}}"

[tasks.build]
description = "Build the binary"
run = "go build  -ldflags \"-X main.Version=$(svu current)-$(date +%Y-%m-%d)\" -o maileryze ."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Vet the code"
run = "go vet ./..."

[tasks.setup]
description = "Configure git to use project hooks"
run = "git config core.hooksPath .githooks"

[tasks.version]
description = "Show current and next version"
run = """
echo "current: $(svu current)"
echo "next:    $(svu next)"
"""

[tasks.release]
description = "Tag and push a new release (uses svu to determine next version)"
run = """
set -e
next=$(svu next)
echo "Releasing $next"
git tag "$next"
git push orgin HEAD
git push "$next"
"""
