name: Release

on:
  push:
    branches:
      - main
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Create version tag
        run: |
          next=$(svu next)
          current=$(svu current)
          if [ "$next" != "$current" ]; then
            echo "Tagging $next"
            git tag "$next"
            git push origin "$next"
          else
            echo "No version bump needed (current: $current)"
          fi

  release:
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
